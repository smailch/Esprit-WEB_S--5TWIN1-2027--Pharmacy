# git clone … && cd Ahmed && docker compose up --build
# Fuseki : http://localhost:3030 · API : http://localhost:8000/docs · Appli : http://localhost:5174
services:
  fuseki:
    image: stain/jena-fuseki:4.8.0
    environment:
      ADMIN_PASSWORD: ${FUSEKI_PASSWORD:-admin}
      FUSEKI_DATASET_1: pharma
    ports: ["3030:3030"]
    volumes: ["./fuseki-data:/fuseki"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3030/$$/ping || exit 1"]
      interval: 5s
      retries: 20

  backend:
    build:
      context: ..
      dockerfile: Ahmed/backend/Dockerfile
    environment:
      SPARQL_BACKEND: fuseki
      FUSEKI_URL: http://fuseki:3030
      FUSEKI_PASSWORD: ${FUSEKI_PASSWORD:-admin}
      CORS_ORIGINS: http://localhost:5174
    ports: ["8000:8000"]
    depends_on:
      fuseki: { condition: service_healthy }

  frontend:
    image: node:22.11-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_TARGET: http://backend:8000
    ports: ["5174:5174"]
    volumes: ["./frontend:/app", "/app/node_modules"]
    depends_on: [backend]
